version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jobmate-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: jobmate
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobmate-network

  backend:
    build: ./backend
    container_name: jobmate-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/jobmate?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - jobmate-network

  frontend:
    build: ./frontend
    container_name: jobmate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - jobmate-network

volumes:
  mongodb_data:

networks:
  jobmate-network:
    driver: bridge